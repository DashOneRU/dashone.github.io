<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DashOne</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <style>
    @font-face {
      font-family: 'Cantarell';
      src: url('fonts/Cantarell-VF.otf') format('opentype');
      font-weight: 100 900;
      font-style: normal;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cantarell', sans-serif;
      color: #000;
      background: #fff;
      line-height: 1.4;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      background: #202020;
      color: #fff;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    header .logo img {
      height: 40px;
      margin-top: 5px;
    }
    nav {
      display: flex;
      gap: 25px;
      position: relative;
    }
    nav a,
    .dropdown > a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      padding: 5px;
      display: flex;
      align-items: center;
      height: 100%;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: all .2s ease;
      display: flex;
      flex-direction: column;
      white-space: nowrap;
      align-items: center;
    }
    .dropdown-content a {
      color: #fff;
      padding: 10px 15px;
      text-decoration: none;
      font-size: 14px;
    }
    .dropdown:hover .dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .hero {
      text-align: center;
      padding: 140px 20px 18px;
    }
    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.2s;
    }
    .hero p {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-style: italic;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.5s;
    }
    .previews {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      padding: 20px 20px 40px;
      position: relative;
    }
    .block {
      background: #000;
      width: 300px;
      height: 200px;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .block iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .block:hover {
      transform: scale(1.05);
    }
    footer {
      text-align: center;
      padding: 20px;
    }
    footer hr {
      border: none;
      border-top: 1px solid #000;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto 10px;
    }
    footer p {
      font-size: 14px;
    }
    footer img {
      width: 24px;
    }
    footer a {
      text-decoration: none;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
      opacity: 0.9;
      z-index: 999;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="images/logo.png" alt="DashOne Logo"></a>
    </div>
    <nav>
      <div class="dropdown">
        <a href="pages/projects.html">Проекты</a>
        <div class="dropdown-content">
          <a href="pages/prj/mac.html">Macintosh 128K</a>
          <a href="pages/prj/pd.html">PicoDoom</a>
          <a href="pages/prj/db.html">DashBoard</a>
          <a href="pages/projects.html">▼</a>
        </div>
      </div>
      <div class="dropdown">
        <a href="pages/products.html">Продукция</a>
        <div class="dropdown-content">
          <a href="pages/3dworkshop.html">3D Печать</a>
          <a href="pages/market.html">Наши товары</a>
        </div>
      </div>
      <a href="pages/about.html">О нас</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Добро пожаловать!</h1>
    <p>Здесь технологии встречаются с<br>бесконечностью идей…</p>
  </section>

  <section class="previews">
    <div class="block">
      <iframe loading="lazy" allowfullscreen data-youtube="https://www.youtube.com/embed/zbIXdSReHoA" data-youtube-id="zbIXdSReHoA" data-rutube="https://rutube.ru/play/embed/477c461214ea35cb0fc6e5bb2bbf2478/"></iframe>
    </div>

    <div class="block">
      <iframe loading="lazy" allowfullscreen data-youtube="https://www.youtube.com/embed/FBi9z8DZKIU" data-youtube-id="FBi9z8DZKIU" data-rutube="https://rutube.ru/play/embed/0bca4cf2af6e78fe77b6b23e67621ff7/"></iframe>
    </div>

    <div class="block">
      <iframe
        loading="lazy"
        allowfullscreen
        data-youtube="https://www.youtube.com/embed/FpNRc0BIHgY"
        data-youtube-id="FpNRc0BIHgY"
        data-rutube="https://rutube.ru/play/embed/2339c51a401947a0c5b46c3fb6b410fc/">
      </iframe>
    </div>
  </section>

  <footer>
    <hr>
    <p>Адрес для коммерческих запросов и предложений: <a href="mailto:showshinich@gmail.com">showshinich@gmail.com</a></p>
    <p>DashOne RU © 2025-2026</p>
    <a href="https://www.youtube.com/@dashoneru"><img src="images/youtube.webp" alt="YouTube"></a>
    <a href="https://rutube.ru/channel/23543751/"><img src="images/rutube.webp" alt="RuTube"></a>
    <a href="https://t.me/dashone3d"><img src="images/telegram.webp" alt="Telegram"></a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const TIMEOUT = 2000;
      document.querySelectorAll('.previews .block iframe').forEach(iframe => {
        const ytSrc = iframe.dataset.youtube || '';
        const ytId = iframe.dataset.youtubeId || (ytSrc.split('/').pop() || '');
        const rutubeSrc = iframe.dataset.rutube || '';
        if (!ytSrc && !rutubeSrc) return;
        const setIframeSrc = (src) => {
          iframe.src = src;
        };
        if (!ytId) {
          if (rutubeSrc) setIframeSrc(rutubeSrc);
          return;
        }
        const thumb = new Image();
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            if (rutubeSrc) setIframeSrc(rutubeSrc);
          }
        }, TIMEOUT);
        thumb.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          setIframeSrc(ytSrc);
        };
        thumb.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (rutubeSrc) setIframeSrc(rutubeSrc);
        };
        thumb.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(ytId) + '/hqdefault.jpg?__ts=' + Date.now();
      });
    });

    function createSnowflake() {
      const f = document.createElement("div");
      f.className = "snowflake";
      f.style.left = Math.random() * 100 + "vw";
      const size = 3 + Math.random() * 4;
      f.style.width = size + "px";
      f.style.height = size + "px";
      f.style.animationDuration = 4 + Math.random() * 6 + "s";
      f.style.opacity = 0.7 + Math.random() * 0.3;
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 10000);
    }

    setInterval(createSnowflake, 120);
  </script>

</body>
</html>
