<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Мастерская DashOne</title>
  <link rel="icon" href="../images/icon2.png" type="image/png">
  <style>
    @font-face {
      font-family: 'Cantarell';
      src: url('../fonts/Cantarell-VF.otf') format('opentype');
      font-weight: 100 900;
      font-style: normal;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cantarell', sans-serif;
      color: #000;
      background: #fff;
      line-height: 1.4;
    }
	
	.social-buttons {
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  gap: 32px;
	  margin-top: 10px;
	  flex-wrap: wrap;
	}

	.social-buttons a {
	  display: inline-block;
	}

	.social-buttons img {
	  display: block;
	  width: 40px;
	  height: auto;
	  opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.5s;
	}
	
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      background: #497559;
      color: #fff;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    header .logo img {
      height: 40px;
      margin-top: 5px;
    }
    nav {
      display: flex;
      gap: 25px;
      position: relative;
    }
    nav a,
    .dropdown > a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      padding: 5px;
      display: flex;
      align-items: center;
      height: 100%;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: all .2s ease;
      display: flex;
      flex-direction: column;
      white-space: nowrap;
      align-items: center;
    }
    .dropdown-content a {
      color: #fff;
      padding: 10px 15px;
      text-decoration: none;
      font-size: 14px;
    }
    .dropdown:hover .dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .hero {
      text-align: center;
      padding: 140px 20px 0px;
    }
    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.2s;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.5s;
    }
    .hero p img {
      width: 180px;
    }
    .hero2 {
      text-align: center;
      padding: 0px 20px 0px;
    }
    .hero2 h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.2s;
    }
    .hero2 p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.5s;
    }
    .hero2 p img {
      width: 180px;
    }
    .hero2 a {
      text-decoration: none
    }
    .previews {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 40px 20px;
      position: relative;
    }
    .previews2 {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 20px 20px;
      position: relative;
    }
    .block {
      background: #000;
      width: 300px;
      height: 200px;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .block2 {
      background: #000;
      width: 450px;
      height: 250px;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }
    .block2 img {
      width: 100%;
      height: 100%;
      border: none;
    }
    .block2:hover {
      transform: scale(1.05);
    }
    .block img {
      width: 100%;
      height: 100%;
      border: none;
    }
    .block:hover {
      transform: scale(1.05);
    }
    /* Подвал */
    footer {
      text-align: center;
      padding: 20px;
    }
    footer hr {
      border: none;
      border-top: 1px solid #000;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto 10px;
    }
    footer p {
      font-size: 14px;
    }
    footer img {
      width: 24px;
    }
    footer a {
      text-decoration: none
    }
    .page-title {
      text-align: center;
      margin: 6px 20px 30px;
      transform: translateY(-10px);
    }
    .page-title h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.2s;
      line-height: 0.95;
    }
    .page-title .muted {
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.5s;
      color: black;
    }

    /* Основное изменение: контейнер для товаров */
    .products-container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
    }
    
    @media (max-width: 1000px) { 
      .products-grid { 
        grid-template-columns: repeat(2, 1fr); 
      } 
    }
    @media (max-width: 620px)  { 
      .products-grid { 
        grid-template-columns: 1fr; 
      } 
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .18s ease, box-shadow .18s ease;
      cursor: pointer;
      min-height: 360px;
      width: 100%; /* Добавлено */
    }
    .card:hover { 
      transform: translateY(-6px); 
      box-shadow: 0 12px 30px rgba(0,0,0,0.12); 
    }

    .card .thumb {
      width: 100%;
      height: 200px;
      overflow: hidden;
    }
    
    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px 12px 0 0;
    }

    .card .content {
      padding: 14px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
    }

    .card .title { 
      font-weight: 700; 
      font-size: 1.05rem; 
      color: #111; 
    }
    .card .short-desc { 
      font-size: 0.92rem; 
      color: #333; 
      opacity: .9; 
      line-height: 1.2; 
      max-height: 2.6em; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .price-row { 
      display:flex; 
      align-items:baseline; 
      gap:10px; 
      margin-top: auto; 
    }
    .price-current { 
      color: #c41d1d; 
      font-weight: 800; 
      font-size: 1.1rem; 
    }
    .price-old { 
      color: #666; 
      text-decoration: line-through; 
      font-size: .95rem; 
    }
    .availability { 
      font-size: .86rem; 
      color: #216e2a; 
      padding-left: 4px; 
    }
    .availabilityout { 
      font-size: .86rem; 
      color: #9b1d1d; 
      padding-left: 4px; 
    }

  </style>
</head>
